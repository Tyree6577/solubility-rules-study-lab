;padding:45px 33px;display:flex;flex-direction:column;justify-content:center;text-align:center;backface-visibility:hidden;border:1px solid #3d628d;border-radius:20px;background:linear-gradient(135deg,#132b4b,#0c1a2e)}.back{transform:rotateY(180deg);background:linear-gradient(135deg,#113b44,#102535);border-color:#358f81}.label{position:absolute;top:18px;left:20px;color:var(--m);font-size:.73rem;font-weight:850;text-transform:uppercase;letter-spacing:.12em}.play{max-width:800px;margin:auto}.prompt{text-align:center;padding:clamp(26px,7vw,50px)}.compound{font-family:Cambria Math,Cambria,serif;font-size:clamp(3rem,11vw,6rem);line-height:1;margin:23px 0 29px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px}.answer{padding:16px;min-height:72px;border-radius:13px;background:#193b67;border:1px solid #4073b8;color:var(--t);font-weight:850;font-size:1.05rem}.answer.green{background:#133d38;border-color:#2d7c70}.answer.red{background:#442534;border-color:#874051}.feedback{margin-top:15px;padding:19px;text-align:left;border-radius:13px;background:#132641;border:1px solid #2f587f}.feedback.good{background:#123a34;border-color:#308b78}.feedback.bad{background:#452633;border-color:#954457}.feedback p{margin:6px 0}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.detail{padding:9px;border-radius:8px;background:#07152599;font-size:.9rem}.detail b{display:block;color:var(--mint);font-size:.75rem;text-transform:uppercase}.seg{display:flex;gap:7px;flex-wrap:wrap}.option{padding:10px;border-radius:8px;background:#172a45;color:var(--t);border:1px solid var(--line);font-weight:750}.option.on{background:#1b4478;border-color:var(--blue)}.examq{margin-top:13px}.examq .compound{font-size:2rem;text-align:left;margin:8px 0 14px}.result{padding:14px;margin-top:11px;border-radius:10px;background:#0c192b;border-left:4px solid var(--red)}.modal{position:fixed;inset:0;z-index:5;background:#06101ef2;padding:28px;display:grid;place-items:center}.modal .char <script>
(()=>{const $=s=>document.querySelector(s),R={r1:'Rule 1 — Group 1 / always-soluble ions',r3:'Rule 3 — Halides',r4:'Rule 4 — Sulfates',r5:'Rule 5 — Hydroxides and metal oxides',r6:'Rule 6 — Phosphates, carbonates, sulfites, and sulfides'};
const SOL=[['NaNO₃','Soluble','Na⁺','NO₃⁻','r1','None','Nitrates are always soluble.','easy'],['KClO₄','Soluble','K⁺','ClO₄⁻','r1','None','Potassium is Group 1 and perchlorates are always soluble.','easy'],['LiC₂H₃O₂','Soluble','Li⁺','C₂H₃O₂⁻','r1','None','Lithium is Group 1; acetates are always soluble.','easy'],['NH₄ClO₃','Soluble','NH₄⁺','ClO₃⁻','r1','None','Ammonium and chlorate compounds are always soluble.','easy'],['CaCO₃','Insoluble','Ca²⁺','CO₃²⁻','r6','No Group 1 or NH₄⁺ cation','Carbonates are generally insoluble.','easy'],['MgO','Insoluble','Mg²⁺','O²⁻','r5','Mg²⁺ is not a listed exception','Metal oxides are generally insoluble.','easy'],['Na₂CO₃','Soluble','Na⁺','CO₃²⁻','r1 + r6','Group 1 override','Carbonates are generally insoluble, but sodium is Group 1.','medium'],['(NH₄)₂S','Soluble','NH₄⁺','S²⁻','r1 + r6','Ammonium override','Sulfides are generally insoluble, but ammonium makes this compound soluble.','medium'],['AgCl','Insoluble','Ag⁺','Cl⁻','r3','Ag⁺ is a halide exception','Chlorides are generally soluble except with silver, lead, and Hg₂²⁺.','medium'],['PbBr₂','Insoluble','Pb²⁺','Br⁻','r3','Pb²⁺ is a halide exception','Bromides are generally soluble except with silver, lead, and Hg₂²⁺.','medium'],['Hg₂I₂','Insoluble','Hg₂²⁺','I⁻','r3','Hg₂²⁺ is a halide exception','The exception is mercury(I), Hg₂²⁺.','hard'],['HgCl₂','Soluble','Hg²⁺','Cl⁻','r3','Hg²⁺ is not the Hg₂²⁺ exception','Do not treat Hg²⁺ as mercury(I).','hard'],['BaSO₄','Insoluble','Ba²⁺','SO₄²⁻','r4','Ba²⁺ is a sulfate exception','Barium sulfate is an insoluble sulfate exception.','medium'],['PbSO₄','Insoluble','Pb²⁺','SO₄²⁻','r4','Pb²⁺ is a sulfate exception','Lead(II) sulfate is an insoluble sulfate exception.','hard'],['Hg₂SO₄','Insoluble','Hg₂²⁺','SO₄²⁻','r4','Hg₂²⁺ is a sulfate exception','Mercury(I) sulfate is an insoluble sulfate exception on the official sheet.','hard'],['Ca(OH)₂','Soluble','Ca²⁺','OH⁻','r5','Ca²⁺ is a hydroxide exception','Use the course-chart exception; it has limited real-water solubility.','medium'],['Fe(OH)₃','Insoluble','Fe³⁺','OH⁻','r5','Fe³⁺ is not a listed exception','Hydroxides are generally insoluble.','medium'],['K₃PO₄','Soluble','K⁺','PO₄³⁻','r1 + r6','Group 1 override','Phosphates are generally insoluble, but potassium is Group 1.','hard'],['ZnSO₃','Insoluble','Zn²⁺','SO₃²⁻','r6','No Group 1 or NH₄⁺ cation','Sulfites are generally insoluble.','hard']].map((x,i)=>({id:'s'+i,f:x[0],a:x[1],cat:x[2],an:x[3],r:x[4],e:x[5],why:x[6],d:x[7],type:'sol'}));
const ION=[['NaCl','Na⁺','Cl⁻','sodium','chloride','easy'],['CaO','Ca²⁺','O²⁻','calcium','oxide','easy'],['MgBr₂','Mg²⁺','Br⁻','magnesium','bromide','easy'],['BaSO₄','Ba²⁺','SO₄²⁻','barium','sulfate','medium'],['Ca₃(PO₄)₂','Ca²⁺','PO₄³⁻','calcium','phosphate','medium'],['Pb(NO₃)₂','Pb²⁺','NO₃⁻','lead(II)','nitrate','medium'],['(NH₄)₂CO₃','NH₄⁺','CO₃²⁻','ammonium','carbonate','medium'],['Fe₂(SO₄)₃','Fe³⁺','SO₄²⁻','iron(III)','sulfate','hard'],['Cu(C₂H₃O₂)₂','Cu²⁺','C₂H₃O₂⁻','copper(II)','acetate','hard'],['Hg₂Cl₂','Hg₂²⁺','Cl⁻','mercury(I)','chloride','hard'],['Al₂(SO₃)₃','Al³⁺','SO₃²⁻','aluminum','sulfite','hard'],['KClO₃','K⁺','ClO₃⁻','potassium','chlorate','medium']].map((x,i)=>({id:'i'+i,f:x[0],cat:x[1],an:x[2],cn:x[3],name:x[4],d:x[5],type:'ion'}));
const PRE=[['AgNO₃(aq) + NaCl(aq)','AgCl(s)','AgCl is insoluble: Ag⁺ is a chloride exception.','AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)','r3','easy'],['BaCl₂(aq) + Na₂SO₄(aq)','BaSO₄(s)','BaSO₄ is an insoluble sulfate exception.','BaCl₂(aq) + Na₂SO₄(aq) → BaSO₄(s) + 2 NaCl(aq)','r4','easy'],['Pb(NO₃)₂(aq) + 2 KI(aq)','PbI₂(s)','Pb²⁺ is an iodide exception.','Pb(NO₃)₂(aq) + 2 KI(aq) → PbI₂(s) + 2 KNO₃(aq)','r3','medium'],['CaCl₂(aq) + Na₂CO₃(aq)','CaCO₃(s)','Carbonates are generally insoluble.','CaCl₂(aq) + Na₂CO₃(aq) → CaCO₃(s) + 2 NaCl(aq)','r6','medium'],['FeCl₃(aq) + 3 NaOH(aq)','Fe(OH)₃(s)','Hydroxides are generally insoluble.','FeCl₃(aq) + 3 NaOH(aq) → Fe(OH)₃(s) + 3 NaCl(aq)','r5','medium'],['NaNO₃(aq) + KCl(aq)','No precipitate','Both double-replacement products are soluble.','NaNO₃(aq) + KCl(aq) → NaCl(aq) + KNO₃(aq)','r1','easy'],['CuSO₄(aq) + BaCl₂(aq)','BaSO₄(s)','The products are CuCl₂(aq) and BaSO₄(s).','CuSO₄(aq) + BaCl₂(aq) → BaSO₄(s) + CuCl₂(aq)','r4','hard'],['3 CaCl₂(aq) + 2 Na₃PO₄(aq)','Ca₃(PO₄)₂(s)','Calcium phosphate is insoluble.','3 CaCl₂(aq) + 2 Na₃PO₄(aq) → Ca₃(PO₄)₂(s) + 6 NaCl(aq)','r6','hard'],['2 AgNO₃(aq) + Na₂S(aq)','Ag₂S(s)','Silver sulfide is insoluble.','2 AgNO₃(aq) + Na₂S(aq) → Ag₂S(s) + 2 NaNO₃(aq)','r6','hard'],['K₂SO₄(aq) + MgCl₂(aq)','No precipitate','KCl and MgSO₄ are soluble.','K₂SO₄(aq) + MgCl₂(aq) → 2 KCl(aq) + MgSO₄(aq)','r1','medium']].map((x,i)=>({id:'p'+i,react:x[0],a:x[1],why:x[2],eq:x[3],r:x[4],d:x[5],type:'pre'}));
const FLASH=[['ion','What ions make up BaSO₄?','Ba²⁺ and SO₄²⁻: barium and sulfate.'],['ion','What is the formula for phosphate?','PO₄³⁻.'],['ion','Identify the ions in Pb(NO₃)₂.','Pb²⁺ and NO₃⁻: lead(II) and nitrate.'],['ion','What ion is Hg₂²⁺?','The mercury(I) dimer; it is different from Hg²⁺.'],['ion','What ions make up Ca₃(PO₄)₂?','Ca²⁺ and PO₄³⁻.'],['rule','What should you check before classifying a generally soluble compound?','Whether its cation is listed as an exception.'],['rule','What does (aq) mean?','The substance is dissolved in water.'],['rule','What does a precipitate mean?','An insoluble solid that forms during a reaction.'],['rule','What is the first clue in Na₂CO₃?','Na⁺ is Group 1, so the compound is soluble.'],['rule','Which mercury ion is the halide exception?','Hg₂²⁺, not Hg²⁺.'],['rule','What is the chart workflow?','Identify ions, find the anion rule, then check cation exceptions.'],['rule','Are metal oxides generally soluble?','No; use the course-chart exceptions.']].map((x,i)=>({id:'f'+i,cat:x[0],q:x[1],a:x[2]}));
let old;try{old=JSON.parse(localStorage.getItem('solubility-study-lab-v2'))||{}}catch{old={}};let S={v:'home',chart:old.chart!==false,cards:old.cards||{},total:old.total||0,correct:old.correct||0,weak:old.weak||{},diff:'medium',flash:'all',fi:0,flip:false,q:null,feedback:null,stage:'cat',exam:null,ea:{},elen:10,ediff:'mixed',cats:{ion:true,sol:true,pre:true}};const save=()=>localStorage.setItem('solubility-study-lab-v2',JSON.stringify({chart:S.chart,cards:S.cards,total:S.total,correct:S.correct,weak:S.weak}));const choose=(x,d)=>{let a=x.filter(q=>d==='mixed'||q.d===d);return a[Math.floor(Math.random()*a.length)]||x[0]},log=(ok,key)=>{S.total++;if(ok)S.correct++;else S.weak[key]=(S.weak[key]||0)+1};
const modes=()=>'<div class="tools"><span class="muted">Study mode</span><div class="mode"><button class="'+(S.chart?'on':'')+'" onclick="appClick(\'chart\',true)">Chart Allowed</button><button class="'+(!S.chart?'on':'')+'" onclick="appClick(\'chart\',false)">No Chart</button></div></div>';const chart=()=>S.chart?'<aside class="chart"><p class="eyebrow">Chart allowed</p><h3>Professor’s solubility chart</h3><img src="chem-1311-formulas-and-constants.png" alt="CHEM 1311 Formulas and Constants sheet with solubility rules" style="display:block;width:100%;max-height:66vh;object-fit:contain;object-position:top;background:#fff;border-radius:8px"><p><button class="btn ghost small" onclick="appClick(\'modal\')">Expand reference</button></p></aside>':'';
function home(){let m=Object.values(S.cards).filter(x=>x==='know').length,n=Object.values(S.cards).filter(x=>x==='need').length,a=S.total?Math.round(S.correct/S.total*100):0;return '<section><div class="hero"><p class="eyebrow">CHEM 1311 · chart-smart practice</p><h1>Read the chart.<br>Check the exception.</h1><p class="lede">Practice the exact workflow for your exam: identify ions, find the rule, check exceptions, and predict whether a solid forms.</p><span class="chip">Chart Allowed is on by default</span></div><div class="grid four" style="margin-top:16px">'+[['learn','01','Use the chart','Find rules and exception patterns.'],['ion','02','Identify the Ions','Read formulas before classification.'],['sol','03','Solubility','Make a call and see why.'],['pre','04','Precipitates','Apply rules to reactions.']].map(x=>'<button class="card launch" onclick="appClick(\'v\',\''+x[0]+'\')"><span class="n">'+x[1]+'</span><h2>'+x[2]+'</h2><p class="muted">'+x[3]+'</p><span class="go">Study →</span></button>').join('')+'</div><div class="grid four" style="margin-top:16px"><div class="card stat"><b>'+m+'/'+FLASH.length+'</b><span>cards mastered</span></div><div class="card stat"><b>'+n+'</b><span>need review</span></div><div class="card stat"><b>'+S.total+'</b><span>answers logged</span></div><div class="card stat"><b>'+a+'%</b><span>accuracy</span></div></div></section>'}
function learn(){return '<section><div class="head"><div><p class="eyebrow">Official-reference workflow</p><h2>Find the anion, then inspect the cation</h2><p class="muted">Use the exact professor sheet shown in Chart Allowed mode to confirm each numbered rule and exception.</p></div>'+modes()+'</div><div class="grid two"><article class="card rule a"><span class="tag">Rule 1 · always soluble</span><h3>Group 1, ammonium, and polyatomics</h3><p class="formula">Li⁺, Na⁺, K⁺, Rb⁺, Cs⁺, NH₄⁺, NO₃⁻, ClO₄⁻, ClO₃⁻, C₂H₃O₂⁻</p></article><article class="card rule g"><span class="tag">Rule 3 · generally soluble</span><h3>Halides</h3><p class="formula">Cl⁻, Br⁻, I⁻</p><p class="muted">Exceptions: Ag⁺, Pb²⁺, Hg₂²⁺. Hg²⁺ is different.</p></article><article class="card rule g"><span class="tag">Rule 4 · generally soluble</span><h3>Sulfates</h3><p class="formula">SO₄²⁻</p><p class="muted">Exceptions: Pb²⁺, Ca²⁺, Sr²⁺, Hg₂²⁺, and Ba²⁺.</p></article><article class="card rule i"><span class="tag">Rule 5 · generally insoluble</span><h3>Hydroxides and metal oxides</h3><p class="formula">OH⁻, O²⁻</p><p class="muted">Exceptions: Group 1A metals, Ca²⁺, Sr²⁺, and Ba²⁺. Oxide ions do not exist freely in water; dissolved oxides form hydroxides.</p></article><article class="card rule i"><span class="tag">Rule 6 · generally insoluble</span><h3>Other common anions</h3><p class="formula">PO₄³⁻, CO₃²⁻, SO₃²⁻, S²⁻</p><p class="muted">Group 1 and NH₄⁺ are key overrides.</p></article><article class="card rule e"><span class="tag">Exam workflow</span><h3>Three deliberate checks</h3><p>Identify ions. Find the anion’s rule. Compare the cation to that row’s exceptions.</p></article></div><div class="callout"><b>Professor chart loaded:</b> Chart Allowed now shows your exact CHEM 1311 Formulas and Constants sheet. Rule labels and exceptions in this app follow that sheet.</div></section>'}
function flash(){let d=FLASH.filter(x=>S.flash==='all'||x.cat===S.flash);S.fi=(S.fi%d.length+d.length)%d.length;let c=d[S.fi],mark=S.cards[c.id];return '<section><div class="head"><div><p class="eyebrow">Understand, don’t just memorize</p><h2>Flashcards</h2></div><div class="tools"><div class="seg"><button class="'+(S.flash==='all'?'on':'')+'" onclick="appClick(\'fc\',\'all\')">All</button><button class="'+(S.flash==='ion'?'on':'')+'" onclick="appClick(\'fc\',\'ion\')">Recognizing Ions</button><button class="'+(S.flash==='rule'?'on':'')+'" onclick="appClick(\'fc\',\'rule\')">Solubility Thinking</button></div><button class="btn red small" onclick="appClick(\'reset\')">Reset marks</button></div></div><div class="flash"><p class="muted" style="text-align:center">'+(S.fi+1)+' of '+d.length+(mark?' · '+(mark==='know'?'mastered':'needs practice'):'')+'</p><div class="flashcard '+(S.flip?'flip':'')+'" onclick="appClick(\'flip\')"><div class="inner"><div class="face"><span class="label">Question · tap to flip</span><h2>'+c.q+'</h2></div><div class="face back"><span class="label">Answer · tap to return</span><p>'+c.a+'</p></div></div></div><div class="tools" style="justify-content:center"><button class="btn ghost" onclick="appClick(\'fp\')">Previous</button><button class="btn ghost" onclick="appClick(\'mark\',\'need\')">Need Practice</button><button class="btn primary" onclick="appClick(\'mark\',\'know\')">I Know This</button><button class="btn ghost" onclick="appClick(\'fn\')">Next</button></div></div></section>'}
function sol(){if(!S.q||S.q.type!=='sol')S.q=choose(SOL,S.diff);let q=S.q;return '<section class="play"><div class="head"><div><p class="eyebrow">Use the rule, not a guess</p><h2>Soluble or insoluble?</h2></div><div class="tools"><select onchange="appClick(\'diff\',this.value)"><option>easy</option><option '+(S.diff==='medium'?'selected':'')+'>medium</option><option>hard</option></select>'+modes()+'</div></div><div class="layout"><div class="card prompt"><p class="muted">Is this compound soluble or insoluble in water?</p><div class="compound">'+q.f+'</div>'+(!S.feedback?'<div class="answers"><button class="answer green" onclick="appClick(\'sola\',\'Soluble\')">Soluble</button><button class="answer red" onclick="appClick(\'sola\',\'Insoluble\')">Insoluble</button></div>':fb(q))+'</div>'+chart()+'</div></section>'}
function fb(q){let g=S.feedback===q.a;return '<div class="feedback '+(g?'good':'bad')+'"><h3>'+ (g?'Correct — good chart reading.':'Review the chart path.')+'</h3><p><b>Correct answer: '+q.a+'.</b> '+q.why+'</p><div class="details"><div class="detail"><b>Cation</b>'+q.cat+'</div><div class="detail"><b>Anion</b>'+q.an+'</div><div class="detail"><b>Relevant rule</b>'+q.r.split(' + ').map(x=>R[x]).join(' + ')+'</div><div class="detail"><b>Exception?</b>'+q.e+'</div></div><button class="btn primary" style="margin-top:14px" onclick="appClick(\'next\')">Next question</button></div>'}
function ion(){if(!S.q||S.q.type!=='ion')S.q=choose(ION,S.diff);let q=S.q,st=S.stage,correct=st==='cat'?q.cat:st==='an'?q.an:q.name,prompt=st==='cat'?'What is the cation?':st==='an'?'What is the anion?':'What is the name of the anion?',choices=st==='cat'?[q.cat,'Na⁺','Ca²⁺','Fe³⁺','NH₄⁺']:st==='an'?[q.an,'Cl⁻','SO₄²⁻','NO₃⁻','CO₃²⁻']:[q.name,'chloride','sulfate','nitrate','carbonate'];return '<section class="play"><div class="head"><div><p class="eyebrow">Read formulas first</p><h2>Identify the Ions</h2></div><div class="tools"><select onchange="appClick(\'diff\',this.value)"><option>easy</option><option '+(S.diff==='medium'?'selected':'')+'>medium</option><option>hard</option></select>'+modes()+'</div></div><div class="layout"><div class="card prompt"><p class="muted">'+prompt+'</p><div class="compound">'+q.f+'</div>'+(!S.feedback?'<div class="answers">'+[...new Set(choices)].slice(0,4).map(x=>'<button class="answer" onclick="appClick(\'iona\',\''+x+'\')">'+x+'</button>').join('')+'</div>':'<div class="feedback '+(S.feedback?'good':'bad')+'"><h3>'+(S.feedback?'Correct.':'Not quite.')+'</h3><p><b>'+correct+'.</b> The formula contains '+q.cat+' ('+q.cn+') and '+q.an+' ('+q.name+').</p><button class="btn primary" onclick="appClick(\'inext\')">'+(st==='name'?'Next compound':'Next part')+'</button></div>')+'</div>'+chart()+'</div></section>'}
function pre(){if(!S.q||S.q.type!=='pre')S.q=choose(PRE,S.diff);let q=S.q,opts=[q.a,'AgCl(s)','BaSO₄(s)','CaCO₃(s)','Fe(OH)₃(s)','PbI₂(s)','No precipitate'];return '<section class="play"><div class="head"><div><p class="eyebrow">Double replacement practice</p><h2>Predict the Precipitate</h2></div><div class="tools"><select onchange="appClick(\'diff\',this.value)"><option>easy</option><option '+(S.diff==='medium'?'selected':'')+'>medium</option><option>hard</option></select>'+modes()+'</div></div><div class="layout"><div class="card prompt"><p class="muted">What precipitate forms, if any?</p><h2 class="formula">'+q.react+'</h2>'+(!S.feedback?'<div class="answers">'+[...new Set(opts)].slice(0,4).map(x=>'<button class="answer" onclick="appClick(\'prea\',\''+x+'\')">'+x+'</button>').join('')+'</div>':'<div class="feedback '+(S.feedback?'good':'bad')+'"><h3>'+(S.feedback?'Correct.':'Check the products and chart.')+'</h3><p><b>Correct answer: '+q.a+'.</b> '+q.why+'</p><div class="detail"><b>Balanced equation</b>'+q.eq+'</div><div class="detail" style="margin-top:8px"><b>Relevant rule</b>'+R[q.r]+'</div><button class="btn primary" style="margin-top:14px" onclick="appClick(\'next\')">Next reaction</button></div>')+'</div>'+chart()+'</div></section>'}
function exam(){if(S.exam)return run();return '<section><div class="head"><div><p class="eyebrow">Exam-style practice</p><h2>Practice Exam</h2><p class="muted">Answers remain hidden until you submit.</p></div>'+modes()+'</div><div class="card grid two"><div><h3>Questions</h3><div class="seg">'+[10,20,30,50].map(n=>'<button class="'+(S.elen===n?'on':'')+'" onclick="appClick(\'len\','+n+')">'+n+'</button>').join('')+'</div></div><div><h3>Difficulty</h3><div class="seg">'+['easy','medium','hard','mixed'].map(x=>'<button class="'+(S.ediff===x?'on':'')+'" onclick="appClick(\'ediff\',\''+x+'\')">'+x+'</button>').join('')+'</div></div><div><h3>Categories</h3><div class="seg">'+[['ion','Ions'],['sol','Solubility'],['pre','Precipitates']].map(x=>'<button class="'+(S.cats[x[0]]?'on':'')+'" onclick="appClick(\'cat\',\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div></div><div style="align-self:end"><button class="btn primary" onclick="appClick(\'start\')">Start practice exam</button></div></div></section>'}
function ans(q){return q.type==='sol'?q.a:q.type==='ion'?q.cat:q.a}function run(){if(S.exam.done){let wrong=S.exam.items.filter((q,i)=>S.ea[i]!==ans(q)),score=S.exam.items.length-wrong.length,pct=Math.round(score/S.exam.items.length*100);return '<section><div class="card"><p class="eyebrow">Results</p><h2>'+score+'/'+S.exam.items.length+' correct · '+pct+'%</h2><p class="muted">Weakest categories: '+(Object.keys(S.exam.miss).join(', ')||'none in this set')+'.</p><button class="btn primary" onclick="appClick(\'weak\')">Practice My Weak Areas</button> <button class="btn ghost" onclick="appClick(\'new\')">New exam</button></div>'+wrong.map(q=>'<div class="result"><b>'+ (q.type==='sol'?q.f:q.type==='ion'?q.f:q.react)+'</b><p>Correct: <b>'+ans(q)+'</b><br>'+ (q.type==='sol'?R[q.r]+'. '+q.why:q.type==='ion'?'Cation: '+q.cat+'; anion: '+q.an+' ('+q.name+').':R[q.r]+'. '+q.why)+'</p></div>').join('')+'</section>'}return '<section><div class="head"><div><p class="eyebrow">Chart '+(S.chart?'available':'hidden')+' · answers hidden</p><h2>Practice Exam</h2></div><button class="btn primary" onclick="appClick(\'submit\')">Submit exam</button></div><div class="layout"><div>'+S.exam.items.map((q,i)=>'<article class="card examq"><h3>'+(i+1)+'. '+(q.type==='sol'?'Is <span class="formula">'+q.f+'</span> soluble or insoluble?':q.type==='ion'?'What is the cation in <span class="formula">'+q.f+'</span>?':'Which precipitate forms?<br><span class="formula">'+q.react+'</span>')+'</h3><div class="seg">'+[...new Set([ans(q),...(q.type==='sol'?['Soluble','Insoluble']:q.type==='ion'?['Na⁺','Ca²⁺','Fe³⁺','NH₄⁺']:['AgCl(s)','BaSO₄(s)','CaCO₃(s)','No precipitate'])])].slice(0,4).map(x=>'<button class="option '+(S.ea[i]===x?'on':'')+'" onclick="appClick(\'ea\','+i+',\''+x+'\')">'+x+'</button>').join('')+'</div></article>').join('')+'</div>'+chart()+'</div></section>'}
function view(){return S.v==='home'?home():S.v==='learn'?learn():S.v==='flash'?flash():S.v==='sol'?sol():S.v==='ion'?ion():S.v==='pre'?pre():exam()}function update(){let m=Object.values(S.cards).filter(x=>x==='know').length,p=Math.round((m/FLASH.length*.4+Math.min(S.total,40)/40*.6)*100);$('#pt').textContent=p+'% study progress';$('#pb').style.width=p+'%';$('#nav').innerHTML=[['home','Home'],['learn','Learn'],['flash','Flashcards'],['sol','Solubility'],['ion','Identify Ions'],['pre','Precipitates'],['exam','Practice Exam']].map(x=>'<button class="'+(S.v===x[0]?'on':'')+'" onclick="appClick(\'v\',\''+x[0]+'\')">'+x[1]+'</button>').join('');$('#app').innerHTML=view()}
window.appClick=(a,...x)=>{if(a==='v'){S.v=x[0];S.q=null;S.feedback=null}if(a==='chart'){S.chart=x[0]===true||x[0]==='true';save()}if(a==='modal'){$('#modal').className='modal';$('#modal').innerHTML='<div class="chart"><div class="head"><h2>Professor’s chart</h2><button class="btn ghost small" onclick="appClick(\'close\')">Close</button></div><img src="chem-1311-formulas-and-constants.png" alt="CHEM 1311 Formulas and Constants sheet with solubility rules" style="display:block;width:100%;max-height:82vh;object-fit:contain;object-position:top;background:#fff;border-radius:8px"></div>';return}if(a==='close'){$('#modal').className='hidden';return}if(a==='diff'){S.diff=x[0];S.q=null;S.feedback=null}if(a==='fc'){S.flash=x[0];S.fi=0;S.flip=false}if(a==='flip')S.flip=!S.flip;if(a==='fp'){S.fi--;S.flip=false}if(a==='fn'){S.fi++;S.flip=false}if(a==='mark'){let d=FLASH.filter(z=>S.flash==='all'||z.cat===S.flash),q=d[(S.fi%d.length+d.length)%d.length];S.cards[q.id]=x[0];S.fi++;S.flip=false;save()}if(a==='reset'){if(confirm('Reset all flashcard marks?')){S.cards={};save()}}if(a==='sola'){let ok=x[0]===S.q.a;S.feedback=x[0];log(ok,S.q.r);save()}if(a==='iona'){let right=S.stage==='cat'?S.q.cat:S.stage==='an'?S.q.an:S.q.name,ok=x[0]===right;S.feedback=ok;log(ok,'ions');save()}if(a==='inext'){S.feedback=null;if(S.stage==='cat')S.stage='an';else if(S.stage==='an')S.stage='name';else{S.stage='cat';S.q=null}}if(a==='prea'){let ok=x[0]===S.q.a;S.feedback=ok;log(ok,S.q.r);save()}if(a==='next'){S.q=null;S.feedback=null}if(a==='len')S.elen=+x[0];if(a==='ediff')S.ediff=x[0];if(a==='cat')S.cats[x[0]]=!S.cats[x[0]];if(a==='start'){let p=[];if(S.cats.sol)p.push(...SOL);if(S.cats.ion)p.push(...ION);if(S.cats.pre)p.push(...PRE);p=p.filter(q=>S.ediff==='mixed'||q.d===S.ediff);if(!p.length)p=[...SOL,...ION,...PRE];S.exam={items:Array.from({length:S.elen},()=>p[Math.floor(Math.random()*p.length)]),done:false,miss:{}};S.ea={}}if(a==='ea')S.ea[+x[0]]=x[1];if(a==='submit'){let miss={};S.exam.items.forEach((q,i)=>{let ok=S.ea[i]===ans(q);log(ok,q.type);if(!ok)miss[q.type]=(miss[q.type]||0)+1});S.exam.done=true;S.exam.miss=miss;save()}if(a==='new'){S.exam=null;S.ea={}}if(a==='weak'){let types=Object.keys(S.exam.miss),p=[...SOL,...ION,...PRE].filter(q=>types.includes(q.type));if(!p.length)p=[...SOL,...ION,...PRE];S.exam={items:Array.from({length:10},()=>p[Math.floor(Math.random()*p.length)]),done:false,miss:{}};S.ea={}}update()};update()})();
</script></body></html>
